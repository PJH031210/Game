<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니게임 아케이드</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#181A2E;
    --bg-2:#20233D;
    --gold:#FFC93C;
    --coral:#FF5D73;
    --teal:#00C2A8;
    --cream:#F4EFEA;
    --cream-dim:#B9B5C4;
    --line: rgba(244,239,234,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,201,60,0.08), transparent 55%),
      radial-gradient(ellipse at 85% 15%, rgba(255,93,115,0.08), transparent 50%),
      var(--bg);
    color:var(--cream);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:64px 24px 80px;
  }

  /* 홈으로 가기 버튼 스타일 추가 */
  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--cream-dim);
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    margin-bottom: 32px;
    transition: all 0.18s ease;
  }
  .home-btn:hover {
    color: var(--cream);
    border-color: var(--cream-dim);
    transform: translateY(-2px);
  }
  .home-btn svg {
    width: 16px;
    height: 16px;
  }

  header{
    text-align:center;
    margin-bottom:56px;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--gold);
    margin:0 0 12px;
    font-weight:500;
  }
  h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:clamp(40px, 7vw, 72px);
    line-height:0.95;
    margin:0 0 16px;
    letter-spacing:0.01em;
    color:var(--cream);
    text-shadow: 3px 3px 0 var(--coral);
  }
  header p{
    color:var(--cream-dim);
    font-size:16px;
    margin:0 auto;
    max-width:440px;
    line-height:1.6;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
