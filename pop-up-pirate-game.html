<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>통아저씨는 무서워!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sea-deep: #0B3D5C;
    --sea-mid: #164863;
    --wood-rim: #A9723F;
    --wood-rim-dark: #7A4E27;
    --wood-hoop: #5A3A1E;
    --hole-dark: #241408;
    --hole-mid: #3A2513;
    --blade: #DCE6EC;
    --blade-shadow: #9AA9B4;
    --hilt: #C0392B;
    --hilt-dark: #922219;
    --skin: #F1C27D;
    --bandana: #D64545;
    --bandana-dark: #A93030;
    --ink: #1B2A41;
    --paper: #FFF7EC;
    --accent: #F2B705;
    --accent-dark: #C79203;
    --success: #33B86C;
    --danger: #E24B3C;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }

  body {
    font-family: 'Nunito', sans-serif;
    color: var(--paper);
    background:
      radial-gradient(circle at 20% 0%, rgba(255,255,255,0.05), transparent 45%),
      linear-gradient(160deg, var(--sea-mid) 0%, var(--sea-deep) 75%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    overflow-x: hidden;
  }

  .stage {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .title {
    font-family: 'Jua', sans-serif;
    font-weight: 400;
    font-size: clamp(26px, 7vw, 34px);
    margin: 0 0 4px;
    color: var(--paper);
    text-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }

  .subtitle {
    font-size: 13.5px;
    font-weight: 700;
    color: #B9D4E6;
    margin: 0 0 18px;
    opacity: 0.9;
  }

  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }

  .score-chip {
    background: rgba(0,0,0,0.22);
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 8px 14px;
    min-width: 76px;
  }

  .score-chip .label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #B9D4E6;
    opacity: 0.85;
    margin-bottom: 2px;
  }

  .score-chip .value {
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    color: var(--accent);
  }

  /* ---------- 통 (barrel) ---------- */
  .barrel-zone {
    position: relative;
    width: 300px;
    height: 300px;
    margin: 0 auto 20px;
  }

  .barrel-wrap {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .barrel-rim {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      repeating-conic-gradient(
        var(--wood-rim) 0deg 8deg,
        var(--wood-rim-dark) 8deg 16deg
      );
    box-shadow:
      inset 0 0 0 8px var(--wood-hoop),
      inset 0 0 0 12px rgba(0,0,0,0.15),
      0 14px 26px rgba(0,0,0,0.35);
  }

  .barrel-hole {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 70%;
    height: 70%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 45% 40%, var(--hole-mid), var(--hole-dark) 75%);
    box-shadow: inset 0 8px 18px rgba(0,0,0,0.6);
  }

  /* ---------- 검 (swords) ---------- */
  .sword-slot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
  }

  .sword-btn {
    appearance: none;
    border: none;
    padding: 0;
    background: transparent;
    position: absolute;
    left: 108px;
    top: -9px;
    width: 74px;
    height: 18px;
    cursor: pointer;
    transform-origin: left center;
    transform: translateX(0);
    transition: transform 0.16s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .sword-btn .blade {
    position: absolute;
    left: 0;
    top: 4px;
    width: 46px;
    height: 10px;
    background: linear-gradient(180deg, var(--blade), var(--blade-shadow));
    border-radius: 2px 6px 6px 2px;
  }

  .sword-btn .hilt {
    position: absolute;
    left: 44px;
    top: 0;
    width: 30px;
    height: 18px;
    background: linear-gradient(180deg, var(--hilt), var(--hilt-dark));
    border-radius: 3px 8px 8px 3px;
  }

  .sword-btn:hover:not(:disabled) { transform: translateX(-4px); }

  .sword-btn.pushed {
    transform: translateX(-52px);
    cursor: default;
  }
  .sword-btn.pushed .blade { opacity: 0.35; }

  .sword-btn.ejected {
    transition: transform 0.6s cubic-bezier(.36,.07,.19,.97), opacity 0.6s ease 0.15s;
    transform: translateX(160px) translateY(-40px) rotate(50deg);
    opacity: 0;
  }

  .sword-btn:disabled { pointer-events: none; }

  /* ---------- 해적 (pirate) ---------- */
  .pirate {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 96px;
    height: 130px;
    transform: translate(-50%, -50%) translateY(46px) scale(0.55);
    opacity: 0;
    transition: transform 0.55s cubic-bezier(.2,1.4,.4,1), opacity 0.3s ease;
    z-index: 5;
  }

  .pirate.popped {
    transform: translate(-50%, -50%) translateY(-64px) scale(1) rotate(-3deg);
    opacity: 1;
  }

  .pirate .torso {
    position: absolute;
    bottom: 0;
    left: 18px;
    width: 60px;
    height: 60px;
    background: repeating-linear-gradient(90deg, #E7E1D3 0 8px, var(--bandana) 8px 16px);
    border-radius: 10px 10px 4px 4px;
  }

  .pirate .head {
    position: absolute;
    top: 10px;
    left: 22px;
    width: 52px;
    height: 52px;
    background: var(--skin);
    border-radius: 50%;
  }

  .pirate .bandana {
    position: absolute;
    top: -6px;
    left: 16px;
    width: 64px;
    height: 34px;
    background: var(--bandana);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    border-bottom: 4px solid var(--bandana-dark);
  }

  .pirate .bandana-tail {
    position: absolute;
    top: 4px;
    right: -6px;
    width: 20px;
    height: 10px;
    background: var(--bandana);
    border-radius: 0 6px 6px 0;
    transform: rotate(18deg);
  }

  .pirate .eye {
    position: absolute;
    top: 30px;
    width: 6px;
    height: 8px;
    background: var(--ink);
    border-radius: 50%;
  }
  .pirate .eye.left { left: 34px; }
  .pirate .eye.right { left: 54px; }

  .pirate .mustache {
    position: absolute;
    top: 42px;
    left: 30px;
    width: 36px;
    height: 8px;
    background: #3B2415;
    border-radius: 4px;
  }

  .barrel-zone.shake { animation: shake 0.45s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px) rotate(-1.5deg); }
    40% { transform: translateX(8px) rotate(1.5deg); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(4px); }
  }

  .status-line {
    margin-top: 4px;
    min-height: 24px;
    font-weight: 800;
    font-size: 15px;
    color: var(--accent);
  }
  .status-line.success-text { color: var(--success); }
  .status-line.danger-text { color: var(--danger); }

  .actions { margin-top: 12px; }

  .btn {
    font-family: 'Jua', sans-serif;
    font-size: 16px;
    color: var(--ink);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 11px 28px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--accent-dark);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }

  .hint {
    margin-top: 16px;
    font-size: 12px;
    color: #9FBBD1;
  }

  @media (max-width: 360px) {
    .barrel-zone { width: 260px; height: 260px; }
    .score-chip { min-width: 66px; padding: 7px 10px; }
    .score-chip .value { font-size: 19px; }
  }
</style>
</head>
<body>

<div class="stage">
  <h1 class="title">통아저씨는 무서워!</h1>
  <p class="subtitle">검을 하나씩 찔러보세요. 통아저씨가 튀어나오면 게임 끝!</p>

  <div class="scoreboard">
    <div class="score-chip">
      <span class="label">점수</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="score-chip">
      <span class="label">이번 라운드</span>
      <span class="value" id="round">0</span>
    </div>
    <div class="score-chip">
      <span class="label">최고 기록</span>
      <span class="value" id="best">0</span>
    </div>
  </div>

  <div class="barrel-zone" id="barrelZone">
    <div class="barrel-wrap">
      <div class="barrel-rim"></div>
      <div class="barrel-hole"></div>
      <div class="pirate" id="pirate">
        <div class="bandana"><div class="bandana-tail"></div></div>
        <div class="head">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mustache"></div>
        </div>
        <div class="torso"></div>
      </div>
      <div id="swordLayer"></div>
    </div>
  </div>

  <p class="status-line" id="statusLine">검을 하나 골라 찔러보세요</p>

  <div class="actions">
    <button class="btn" id="restartBtn">다시 시작</button>
  </div>

  <p class="hint">안전한 검을 다 찌르면 보너스와 함께 새 라운드가 시작돼요.</p>
</div>

<script>
(function () {
  const SWORD_COUNT = 12;
  const swordLayer = document.getElementById('swordLayer');
  const pirate = document.getElementById('pirate');
  const barrelZone = document.getElementById('barrelZone');
  const scoreEl = document.getElementById('score');
  const roundEl = document.getElementById('round');
  const bestEl = document.getElementById('best');
  const statusLine = document.getElementById('statusLine');
  const restartBtn = document.getElementById('restartBtn');

  let score = 0;
  let best = 0;
  let roundCount = 0;
  let trapIndex = -1;
  let gameOver = false;
  let swords = [];

  function buildSwords() {
    swordLayer.innerHTML = '';
    swords = [];
    for (let i = 0; i < SWORD_COUNT; i++) {
      const angle = (360 / SWORD_COUNT) * i;
      const slot = document.createElement('div');
      slot.className = 'sword-slot';
      slot.style.transform = 'rotate(' + angle + 'deg)';

      const btn = document.createElement('button');
      btn.className = 'sword-btn';
      btn.innerHTML = '<span class="blade"></span><span class="hilt"></span>';
      btn.addEventListener('click', () => handlePress(i));

      slot.appendChild(btn);
      swordLayer.appendChild(slot);
      swords.push(btn);
    }
  }

  function setStatus(text, cls) {
    statusLine.textContent = text;
    statusLine.classList.remove('success-text', 'danger-text');
    if (cls) statusLine.classList.add(cls);
  }

  function newRound() {
    gameOver = false;
    roundCount = 0;
    trapIndex = Math.floor(Math.random() * SWORD_COUNT);
    pirate.classList.remove('popped');
    barrelZone.classList.remove('shake');
    buildSwords();
    roundEl.textContent = roundCount;
    setStatus('검을 하나 골라 찔러보세요');
  }

  function updateScore() {
    scoreEl.textContent = score;
    roundEl.textContent = roundCount;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
    }
  }

  function handlePress(index) {
    if (gameOver) return;
    const btn = swords[index];
    if (btn.disabled) return;

    if (index === trapIndex) {
      triggerPop(btn);
      return;
    }

    btn.classList.add('pushed');
    btn.disabled = true;
    score += 1;
    roundCount += 1;
    updateScore();

    const remaining = SWORD_COUNT - roundCount - 1; // 트랩 검 제외
    if (remaining <= 0) {
      score += 5;
      updateScore();
      setStatus('라운드 클리어! +5 보너스 · 새 라운드 시작', 'success-text');
      setTimeout(newRound, 1000);
    } else {
      setStatus('안전해요! 검 ' + remaining + '개 남음');
    }
  }

  function triggerPop(btn) {
    gameOver = true;
    swords.forEach((s, i) => {
      s.disabled = true;
      if (i !== trapIndex) {
        setTimeout(() => s.classList.add('ejected'), Math.random() * 150);
      }
    });
    btn.classList.add('pushed');
    pirate.classList.add('popped');
    barrelZone.classList.add('shake');
    setStatus('으악! 통아저씨가 튀어나왔어요 · 이번 라운드 ' + roundCount + '개 성공', 'danger-text');
  }

  restartBtn.addEventListener('click', () => {
    score = 0;
    updateScore();
    newRound();
  });

  newRound();
  updateScore();
})();
</script>

</body>
</html>
