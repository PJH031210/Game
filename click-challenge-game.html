<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>클릭 챌린지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #14161B;
    --ink-light: #22252E;
    --tap-a: #FF5F45;
    --tap-b: #FF2D55;
    --accent: #FFD23F;
    --accent-dark: #D9A812;
    --paper: #FFF7EC;
    --success: #33B86C;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--ink);
    color: var(--paper);
  }

  .arena {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  .topbar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 14px 12px calc(10px + env(safe-area-inset-top));
    background: var(--ink-light);
    z-index: 20;
  }

  .stat {
    text-align: center;
  }

  .stat .stat-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.2px;
    color: #9FB0C7;
  }

  .stat .stat-value {
    font-family: 'Bungee', sans-serif;
    font-size: 24px;
    color: var(--accent);
  }

  .tap-zone {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(150deg, var(--tap-a), var(--tap-b));
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    overflow: hidden;
  }

  .tap-zone::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.18), transparent 60%);
    opacity: 0;
    transition: opacity 0.08s ease;
    pointer-events: none;
  }
  .tap-zone.flash::after { opacity: 1; }

  .count {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(84px, 26vw, 150px);
    line-height: 1;
    text-shadow: 0 8px 0 rgba(0,0,0,0.18);
  }

  .tap-hint {
    font-size: 14px;
    font-weight: 700;
    opacity: 0.8;
  }

  /* ---------- overlays ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(10,11,15,0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
  }
  .overlay[hidden] { display: none; }

  .overlay .title {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(26px, 7vw, 36px);
    color: var(--paper);
  }

  .overlay .desc {
    font-size: 14px;
    font-weight: 600;
    color: #B9C6DA;
    max-width: 320px;
  }

  .time-options {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .time-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: var(--paper);
    background: var(--ink-light);
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 10px 18px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .time-btn:hover { transform: translateY(-2px); }
  .time-btn.active {
    background: var(--accent);
    color: var(--ink);
    border-color: var(--accent-dark);
  }

  .start-btn, .restart-btn {
    font-family: 'Bungee', sans-serif;
    font-size: 18px;
    color: var(--ink);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 14px 40px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-dark);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    margin-top: 4px;
  }
  .start-btn:active, .restart-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--accent-dark);
  }

  .countdown-number {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(90px, 30vw, 160px);
    color: var(--accent);
    text-shadow: 0 8px 0 rgba(0,0,0,0.35);
  }

  .result-scores {
    display: flex;
    gap: 16px;
    margin: 4px 0 6px;
  }

  .result-card {
    border-radius: 16px;
    padding: 14px 24px;
    min-width: 118px;
    border: 3px solid rgba(255,255,255,0.14);
    background: var(--ink-light);
  }
  .result-card.record { box-shadow: 0 0 0 4px var(--accent); }

  .result-card .rc-label {
    font-family: 'Bungee', sans-serif;
    font-size: 12px;
    opacity: 0.85;
    letter-spacing: 0.5px;
  }
  .result-card .rc-value {
    font-family: 'Bungee', sans-serif;
    font-size: 34px;
    margin-top: 2px;
    color: var(--accent);
  }

  .confetti {
    position: absolute;
    top: -20px;
    width: 8px;
    height: 14px;
    border-radius: 2px;
    opacity: 0.9;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(115vh) rotate(540deg); opacity: 0.4; }
  }
</style>
</head>
<body>

<div class="arena">
  <div class="topbar">
    <div class="stat">
      <div class="stat-label">남은 시간</div>
      <div class="stat-value" id="timerValue">10</div>
    </div>
    <div class="stat">
      <div class="stat-label">최고 기록</div>
      <div class="stat-value" id="bestValue">0</div>
    </div>
  </div>

  <div class="tap-zone" id="tapZone">
    <div class="count" id="clickCount">0</div>
    <div class="tap-hint">여기를 계속 탭!</div>
  </div>
</div>

<div class="overlay" id="setupOverlay">
  <div class="title">클릭 챌린지</div>
  <div class="desc">제한 시간 안에 최대한 많이 탭해서 나만의 최고 기록에 도전하세요!</div>
  <div class="time-options" id="timeOptions">
    <button class="time-btn" data-time="5">5초</button>
    <button class="time-btn active" data-time="10">10초</button>
    <button class="time-btn" data-time="15">15초</button>
    <button class="time-btn" data-time="30">30초</button>
  </div>
  <button class="start-btn" id="startBtn">시작하기</button>
</div>

<div class="overlay" id="countdownOverlay" hidden>
  <div class="countdown-number" id="countdownNumber">3</div>
</div>

<div class="overlay" id="resultOverlay" hidden>
  <div class="title" id="resultTitle">기록 완료!</div>
  <div class="result-scores">
    <div class="result-card" id="scoreCard">
      <div class="rc-label">이번 기록</div>
      <div class="rc-value" id="scoreFinal">0</div>
    </div>
    <div class="result-card" id="bestCard">
      <div class="rc-label">최고 기록</div>
      <div class="rc-value" id="bestFinal">0</div>
    </div>
  </div>
  <button class="restart-btn" id="restartBtn">다시 도전</button>
</div>

<script>
(function () {
  const tapZone = document.getElementById('tapZone');
  const clickCount = document.getElementById('clickCount');
  const timerValue = document.getElementById('timerValue');
  const bestValue = document.getElementById('bestValue');

  const setupOverlay = document.getElementById('setupOverlay');
  const countdownOverlay = document.getElementById('countdownOverlay');
  const countdownNumber = document.getElementById('countdownNumber');
  const resultOverlay = document.getElementById('resultOverlay');

  const timeOptions = document.getElementById('timeOptions');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  const resultTitle = document.getElementById('resultTitle');
  const scoreFinal = document.getElementById('scoreFinal');
  const bestFinal = document.getElementById('bestFinal');
  const scoreCard = document.getElementById('scoreCard');

  let selectedTime = 10;
  let clicks = 0;
  let best = 0;
  let playing = false;
  let endAt = 0;
  let tickHandle = null;

  timeOptions.querySelectorAll('.time-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      timeOptions.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedTime = Number(btn.dataset.time);
    });
  });

  function flash() {
    tapZone.classList.add('flash');
    setTimeout(() => tapZone.classList.remove('flash'), 80);
  }

  function handleTap(e) {
    e.preventDefault();
    if (!playing) return;
    clicks += 1;
    clickCount.textContent = clicks;
    flash();
  }

  tapZone.addEventListener('pointerdown', handleTap);

  startBtn.addEventListener('click', () => {
    setupOverlay.hidden = true;
    runCountdown();
  });

  restartBtn.addEventListener('click', () => {
    resultOverlay.hidden = true;
    setupOverlay.hidden = false;
  });

  function runCountdown() {
    countdownOverlay.hidden = false;
    const seq = ['3', '2', '1', '시작!'];
    let i = 0;
    countdownNumber.textContent = seq[i];
    const iv = setInterval(() => {
      i += 1;
      if (i >= seq.length) {
        clearInterval(iv);
        countdownOverlay.hidden = true;
        startGame();
        return;
      }
      countdownNumber.textContent = seq[i];
    }, 600);
  }

  function startGame() {
    clicks = 0;
    clickCount.textContent = '0';
    playing = true;
    endAt = Date.now() + selectedTime * 1000;
    timerValue.textContent = selectedTime;
    tick();
  }

  function tick() {
    const remainingMs = endAt - Date.now();
    const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));
    timerValue.textContent = remainingSec;

    if (remainingMs <= 0) {
      endGame();
      return;
    }
    tickHandle = requestAnimationFrame(tick);
  }

  function endGame() {
    playing = false;
    cancelAnimationFrame(tickHandle);
    timerValue.textContent = '0';

    scoreFinal.textContent = clicks;
    scoreCard.classList.remove('record');

    if (clicks > best) {
      best = clicks;
      bestValue.textContent = best;
      resultTitle.textContent = '신기록 달성!';
      scoreCard.classList.add('record');
      spawnConfetti();
    } else {
      resultTitle.textContent = '기록 완료!';
    }
    bestFinal.textContent = best;

    resultOverlay.hidden = false;
  }

  function spawnConfetti() {
    const colors = ['#FFD23F', '#FF5F45', '#2F80ED', '#17C3E6', '#33B86C'];
    for (let i = 0; i < 26; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      resultOverlay.appendChild(c);
      setTimeout(() => c.remove(), 3200);
    }
  }
})();
</script>

</body>
</html>
